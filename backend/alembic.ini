# Alembic config. Keep this file ASCII-only: on Windows it is read with the
# system locale (cp949), so non-ASCII comments break every alembic command.
# Usage: CONTRIBUTING.md. The DB URL comes from app/config.py (see migrations/env.py).

[alembic]
script_location = %(here)s/migrations
# Lets migrations/env.py import the `app` package when run from the CLI.
prepend_sys_path = %(here)s
# Split paths with the OS separator. The legacy default also splits on ":",
# which would cut a Windows path like C:\... in half.
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
